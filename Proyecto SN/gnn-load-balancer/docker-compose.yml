version: '3.8'

services:
  # 1. El Balanceador de Carga Inteligente (Punto de entrada)
  load-balancer:
    build: ./load-balancer
    container_name: load-balancer
    ports:
      - "8080:8080"
    environment:
      - AUTH_URL=http://auth-svc:5000
      - USER_INSTANCES=http://user-svc-1:5000,http://user-svc-2:5000
      - PRODUCT_URL=http://product-svc:5000
    depends_on:
      - auth-svc
      - user-svc-1
      - user-svc-2
      - product-svc
      - redis
    networks:
      - cloud-net

  # 2. Servicio de Autenticación
  auth-svc:
    build: ./services/auth
    container_name: auth-svc
    networks:
      - cloud-net

  # 3. Instancia 1 del Servicio de Usuarios
  user-svc-1:
    build: ./services/user
    container_name: user-svc-1
    environment:
      - INSTANCE_ID=user-svc-1
    networks:
      - cloud-net

  # 4. Instancia 2 del Servicio de Usuarios (Clave para el balanceo)
  user-svc-2:
    build: ./services/user
    container_name: user-svc-2
    environment:
      - INSTANCE_ID=user-svc-2
    networks:
      - cloud-net

  # 5. Servicio de Productos / Catálogo
  product-svc:
    build: ./services/product
    container_name: product-svc
    networks:
      - cloud-net

  # 6. Redis para métricas o estado compartido
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - cloud-net

networks:
  cloud-net:
    driver: bridge