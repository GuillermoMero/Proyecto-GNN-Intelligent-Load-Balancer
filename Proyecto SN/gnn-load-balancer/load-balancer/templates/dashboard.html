<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo de Carga | GNN-RL Load Balancer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-dark { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .node-card { transition: all 0.3s ease; border-left: 6px solid #38bdf8; }
        .node-healthy { border-left-color: #34d399 !important; }
        .node-warning { border-left-color: #facc15 !important; }
        .node-danger { border-left-color: #f87171 !important; background-color: rgba(248, 113, 113, 0.05); }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-4 py-3">
        <span class="navbar-brand mb-0 h1">🛡️ Panel de Control de Carga - ESPOL</span>
        <a href="/" class="btn btn-outline-info btn-sm">Ir al Portal SGA</a>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card card-dark p-4 text-center">
                    <h3 class="text-info mb-2">Estado del Balanceador de Carga (GNN-RL)</h3>
                    <p class="text-muted mb-0">Monitoreo en tiempo real de la distribución de tráfico hacia las instancias de usuarios.</p>
                </div>
            </div>
        </div>

        <!-- Contenedor dinámico de microservicios -->
        <div class="row g-4" id="nodesContainer">
            <div class="col-12 text-center text-muted">Cargando estado de los nodos...</div>
        </div>
    </div>

    <script>
        function updateDashboard() {
            fetch('/api/metrics')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('nodesContainer');
                    container.innerHTML = '';

                    const instances = data.instances;
                    const activeConns = data.active_connections || {};
                    const totalReqs = data.total_requests || {};

                    instances.forEach(instance => {
                        const active = activeConns[instance] || 0;
                        const total = totalReqs[instance] || 0;

                        // Lógica de saturación (puedes ajustar el umbral, ej: si tiene más de 3 conexiones activas simultáneas)
                        let statusClass = 'node-healthy';
                        let statusBadge = '<span class="badge bg-success">Saludable 🟢</span>';
                        let loadText = 'Carga Normal';

                        if (active >= 3) {
                            statusClass = 'node-danger';
                            statusBadge = '<span class="badge bg-danger animate-pulse">¡SATURADO! 🔴</span>';
                            loadText = 'Alta congestión de tráfico';
                        } else if (active >= 2) {
                            statusClass = 'node-warning';
                            statusBadge = '<span class="badge bg-warning text-dark">Carga Media 🟡</span>';
                            loadText = 'Tráfico moderado';
                        }

                        container.innerHTML += `
                            <div class="col-md-6">
                                <div class="card card-dark p-4 node-card ${statusClass} h-100 shadow">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h5 class="text-white mb-0 font-monospace">${instance}</h5>
                                        ${statusBadge}
                                    </div>
                                    <hr class="border-secondary">
                                    <div class="row text-center my-2">
                                        <div class="col-6 border-end border-secondary">
                                            <span class="text-muted d-block small">Conexiones Activas</span>
                                            <h2 class="text-info fw-bold mb-0">${active}</h2>
                                        </div>
                                        <div class="col-6">
                                            <span class="text-muted d-block small">Peticiones Totales</span>
                                            <h2 class="text-light fw-bold mb-0">${total}</h2>
                                        </div>
                                    </div>
                                    <div class="mt-3 text-end">
                                        <small class="text-muted">Estado del nodo: <strong>${loadText}</strong></small>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => console.error("Error al obtener métricas:", err));
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
